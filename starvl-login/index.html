<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARVL - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card">
    <div class="red-gradient"></div>
    <div class="white-glow"></div>
    <div class="arc1"></div>
    <div class="arc2"></div>
    <div class="left">
        <div class="brand">
            <img src="assets/logo-starvl.png" alt="STARVL" class="logo">
            <p class="tagline">MOVIMENTO QUE <span>CONECTA.</span></p>
        </div>
    </div>
    <div class="right">
        <div class="box">
            <h1><em>Bem-vindo</em> de volta!</h1>
            <p class="sub">Faça login para acessar sua conta.</p>
            <form id="frm" novalidate>
                <div class="field">
                    <label for="u">Usuário</label>
                    <div class="wrap" id="wu">
                        <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                        <input type="text" id="u" placeholder="Digite seu usuário" autocomplete="username">
                    </div>
                </div>
                <div class="field">
                    <label for="s">Senha</label>
                    <div class="wrap" id="ws">
                        <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <input type="password" id="s" placeholder="Digite sua senha" autocomplete="current-password">
                        <button type="button" class="eye" id="tg">
                            <svg id="e1" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="e2" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <div class="forgot"><a href="#">Esqueceu a senha?</a></div>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>
        <div class="footer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Segurança, desempenho e confiança.</span>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
